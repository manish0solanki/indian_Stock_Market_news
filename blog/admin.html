<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MarketPulse Admin</title>

<style>

:root {
  --bg: #0d0d16;
  --card: #151522;
  --card-hover: #1b1b2b;
  --border: #292943;
  --text: #f4f4f8;
  --muted: #8d8da8;
  --primary: #f5a623;
  --danger: #ff5c6c;
  --success: #38d996;
  --purple: #35228a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input {
  font: inherit;
}


/* =========================
   LOGIN
   ========================= */

.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 8px;
}

.brand-dot {
  width: 13px;
  height: 13px;
  background: var(--primary);
  transform: rotate(45deg);
}

.login-subtitle {
  color: var(--muted);
  margin-bottom: 28px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 7px;
  color: #c7c7d9;
}

.field input {
  width: 100%;
  padding: 13px 14px;
  background: #10101b;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.field input:focus {
  border-color: var(--primary);
}

.login-button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: #17120a;
  font-weight: 800;
  cursor: pointer;
}

.login-button:hover {
  filter: brightness(1.08);
}

.login-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.login-error {
  display: none;
  margin-top: 14px;
  padding: 11px 12px;
  border-radius: 9px;
  background: rgba(255,92,108,.1);
  border: 1px solid rgba(255,92,108,.25);
  color: #ff8995;
  font-size: 13px;
}


/* =========================
   ADMIN
   ========================= */

.admin-page {
  display: none;
  min-height: 100vh;
}

.topbar {
  height: 58px;
  background: var(--purple);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
}

.topbar-actions {
  display: flex;
  gap: 8px;
}

.topbar-button {
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.1);
  color: white;
  padding: 8px 12px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.topbar-button:hover {
  background: rgba(255,255,255,.2);
}

.container {
  width: min(1100px, calc(100% - 30px));
  margin: 0 auto;
  padding: 30px 0 60px;
}

.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 22px;
}

.page-heading h1 {
  margin: 0;
  font-size: 28px;
}

.page-heading p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.count {
  color: var(--primary);
  font-weight: 800;
}

.search-row {
  margin-bottom: 18px;
}

.search {
  width: 100%;
  max-width: 550px;
  padding: 13px 15px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  outline: none;
}

.search:focus {
  border-color: var(--primary);
}

.status {
  display: none;
  padding: 12px 14px;
  margin-bottom: 18px;
  border-radius: 10px;
  font-size: 13px;
}

.status.success {
  display: block;
  background: rgba(56,217,150,.1);
  border: 1px solid rgba(56,217,150,.25);
  color: var(--success);
}

.status.error {
  display: block;
  background: rgba(255,92,108,.1);
  border: 1px solid rgba(255,92,108,.25);
  color: #ff8995;
}

.articles {
  display: grid;
  gap: 12px;
}

.article {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  transition: background .2s, border-color .2s;
}

.article:hover {
  background: var(--card-hover);
  border-color: #363653;
}

.article-main {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.article-content {
  min-width: 0;
  flex: 1;
}

.article-title {
  margin: 0 0 8px;
  font-size: 17px;
  line-height: 1.35;
}

.article-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 9px;
}

.badge {
  display: inline-flex;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(245,166,35,.1);
  color: var(--primary);
  border: 1px solid rgba(245,166,35,.18);
}

.article-slug {
  color: #777791;
  font-family: monospace;
  font-size: 11px;
  word-break: break-all;
}

.article-excerpt {
  margin-top: 10px;
  color: #a5a5bd;
  font-size: 13px;
  line-height: 1.5;
}

.article-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.action-button {
  border: 1px solid var(--border);
  background: #10101b;
  color: var(--text);
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.action-button:hover {
  background: #202035;
}

.delete-button {
  color: #ff7c88;
  border-color: rgba(255,92,108,.25);
}

.delete-button:hover {
  background: rgba(255,92,108,.1);
}

.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  .topbar {
    padding: 0 14px;
  }

  .container {
    width: min(100% - 20px, 1100px);
    padding-top: 20px;
  }

  .page-heading {
    align-items: flex-start;
    flex-direction: column;
  }

  .article-main {
    flex-direction: column;
  }

  .article-actions {
    width: 100%;
  }

  .action-button {
    flex: 1;
  }

  .topbar-button {
    padding: 7px 9px;
    font-size: 11px;
  }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PAGE
     ========================= -->

<section class="login-page" id="loginPage">

  <div class="login-card">

    <div class="brand">
      <span class="brand-dot"></span>
      MarketPulse
    </div>

    <div class="login-subtitle">
      Blog Administration
    </div>

    <form id="loginForm">

      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Enter username"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

      </div>


      <button
        class="login-button"
        id="loginButton"
        type="submit"
        disabled
      >
        Loading configuration...
      </button>

    </form>


    <div
      class="login-error"
      id="loginError"
    ></div>

  </div>

</section>



<!-- =========================
     ADMIN PAGE
     ========================= -->

<section
  class="admin-page"
  id="adminPage"
>

  <header class="topbar">

    <div class="topbar-brand">

      <span class="brand-dot"></span>

      MarketPulse Admin

    </div>


    <div class="topbar-actions">

      <button
        class="topbar-button"
        id="refreshButton"
        type="button"
      >
        ↻ Refresh
      </button>


      <button
        class="topbar-button"
        id="blogButton"
        type="button"
      >
        📝 Blog
      </button>


      <button
        class="topbar-button"
        id="logoutButton"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>



  <main class="container">


    <div class="page-heading">

      <div>

        <h1>
          Blog Articles
        </h1>

        <p>

          Manage your generated MarketPulse articles.

          Total:

          <span
            class="count"
            id="articleCount"
          >
            0
          </span>

        </p>

      </div>

    </div>



    <div class="search-row">

      <input
        class="search"
        id="searchInput"
        type="search"
        placeholder="Search articles by title, slug, category or tag..."
      >

    </div>



    <div
      id="status"
      class="status"
    ></div>



    <div
      id="articles"
      class="articles"
    >

      <div class="loading">
        Loading articles...
      </div>

    </div>


  </main>

</section>



<script>


/* ============================================================
   CONFIGURATION
   ============================================================ */


/*
  IMPORTANT:

  The API URL is NOT hardcoded anymore.

  It is loaded from:

  https://raw.githubusercontent.com/manish0solanki/indian_Stock_Market_news/main/config.json

  config.json contains:

  {
    "apiBase": "https://marketpulse-cache.manish0solanki20078.workers.dev",
    "newsApiKey": "..."
  }

  We only use apiBase here.

  The newsApiKey is NOT used by this frontend.
*/


const CONFIG_URL =
  'https://raw.githubusercontent.com/manish0solanki/indian_Stock_Market_news/main/config.json';


/*
  This will be populated after config.json loads.

  Example:

  apiBase:
  https://marketpulse-cache.manish0solanki20078.workers.dev

  becomes:

  ADMIN_API:
  https://marketpulse-cache.manish0solanki20078.workers.dev/blog-admin
*/

let ADMIN_API = '';


/*
  Store the complete configuration in memory.

  We don't actually need newsApiKey here,
  but keeping the object available makes the
  configuration easier to extend later.
*/

let appConfig = null;


/* ============================================================
   STATE
   ============================================================ */

let adminUsername = '';
let adminPassword = '';
let posts = [];


/* ============================================================
   ELEMENTS
   ============================================================ */

const loginPage =
  document.getElementById('loginPage');

const adminPage =
  document.getElementById('adminPage');


const loginForm =
  document.getElementById('loginForm');

const loginError =
  document.getElementById('loginError');


const usernameInput =
  document.getElementById('username');

const passwordInput =
  document.getElementById('password');


const loginButton =
  document.getElementById('loginButton');


const articlesEl =
  document.getElementById('articles');

const articleCountEl =
  document.getElementById('articleCount');


const searchInput =
  document.getElementById('searchInput');


const statusEl =
  document.getElementById('status');


const refreshButton =
  document.getElementById('refreshButton');

const logoutButton =
  document.getElementById('logoutButton');

const blogButton =
  document.getElementById('blogButton');


/* ============================================================
   LOAD CONFIGURATION
   ============================================================ */


/*
  Fetch config.json from GitHub.

  We use cache: 'no-store' so that when you change
  apiBase in config.json, the browser doesn't keep
  using an old cached configuration.
*/

async function loadConfig() {

  try {

    console.log(
      'Loading configuration from:',
      CONFIG_URL
    );


    const response = await fetch(
      CONFIG_URL,
      {
        method: 'GET',
        cache: 'no-store'
      }
    );


    if (!response.ok) {

      throw new Error(
        'Could not load config.json. HTTP ' +
        response.status
      );

    }


    const config =
      await response.json();


    /*
      Validate apiBase.
    */

    if (
      !config ||
      typeof config.apiBase !== 'string' ||
      !config.apiBase.trim()
    ) {

      throw new Error(
        'apiBase is missing or invalid in config.json'
      );

    }


    /*
      Store configuration.
    */

    appConfig = config;


    /*
      Remove trailing slash from apiBase.

      This prevents:

      /blog-admin

      becoming:

      //blog-admin
    */

    const apiBase =
      config.apiBase
        .trim()
        .replace(/\/+$/, '');


    /*
      Build the actual admin API endpoint.
    */

    ADMIN_API =
      apiBase + '/blog-admin';


    console.log(
      'Configuration loaded successfully.'
    );

    console.log(
      'API Base:',
      apiBase
    );

    console.log(
      'Admin API:',
      ADMIN_API
    );


    /*
      Enable login now that the API is ready.
    */

    loginButton.disabled = false;

    loginButton.textContent = 'Login';


    return config;


  } catch (error) {

    console.error(
      'Configuration error:',
      error
    );


    loginButton.disabled = true;

    loginButton.textContent =
      'Configuration Error';


    loginError.textContent =
      'Could not load API configuration. ' +
      'Please refresh the page and try again.';


    loginError.style.display =
      'block';


    throw error;

  }

}


/* ============================================================
   HELPERS
   ============================================================ */


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function formatDate(dateString) {

  if (!dateString) {

    return 'Unknown date';

  }


  const date =
    new Date(dateString);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return dateString;

  }


  return date.toLocaleDateString(
    'en-IN',
    {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    }
  );

}


function showStatus(
  message,
  type = 'success'
) {

  statusEl.textContent =
    message;

  statusEl.className =
    'status ' + type;

}


function clearStatus() {

  statusEl.textContent = '';

  statusEl.className =
    'status';

}


/* ============================================================
   LOGIN
   ============================================================ */


loginForm.addEventListener(
  'submit',
  async (event) => {

    event.preventDefault();


    loginError.style.display =
      'none';


    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if (!username || !password) {

      return;

    }


    /*
      Safety check.

      If config.json hasn't loaded,
      don't attempt the API request.
    */

    if (!ADMIN_API) {

      loginError.textContent =
        'API configuration has not loaded yet. ' +
        'Please refresh the page.';

      loginError.style.display =
        'block';

      return;

    }


    /*
      Disable login button while
      authentication is happening.
    */

    loginButton.disabled = true;

    loginButton.textContent =
      'Logging in...';


    try {


      const response =
        await fetch(
          ADMIN_API,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

              username,
              password,

              action: 'login'

            })

          }
        );


      if (!response.ok) {

        throw new Error(
          'HTTP ' +
          response.status
        );

      }


      const data =
        await response.json();


      if (
        !data.success ||
        !data.authenticated
      ) {

        throw new Error(
          data.error ||
          'Invalid username or password'
        );

      }


      /*
        Keep credentials in memory only.

        They are NOT stored in:

        localStorage
        sessionStorage
        cookies

        Once the page is closed,
        they are gone.
      */

      adminUsername =
        username;

      adminPassword =
        password;


      /*
        Show admin page.
      */

      loginPage.style.display =
        'none';

      adminPage.style.display =
        'block';


      /*
        Load articles.
      */

      await loadPosts();


    } catch (error) {

      console.error(
        'Login error:',
        error
      );


      loginError.textContent =
        error.message ||
        'Login failed';


      loginError.style.display =
        'block';


    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        'Login';

    }

  }
);


/* ============================================================
   LOAD POSTS
   ============================================================ */


async function loadPosts() {

  clearStatus();


  articlesEl.innerHTML = `

    <div class="loading">

      Loading articles...

    </div>

  `;


  /*
    Make sure API exists.
  */

  if (!ADMIN_API) {

    articlesEl.innerHTML = `

      <div class="empty">

        API configuration is not available.

        <br>

        <small>
          Please refresh the page.
        </small>

      </div>

    `;

    return;

  }


  try {


    const response =
      await fetch(
        ADMIN_API,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            username:
              adminUsername,

            password:
              adminPassword,

            action:
              'list'

          })

        }
      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.success ||
      !Array.isArray(data.posts)
    ) {

      throw new Error(
        data.error ||
        'Could not load posts'
      );

    }


    posts =
      data.posts;


    articleCountEl.textContent =
      posts.length;


    renderPosts();


  } catch (error) {

    console.error(
      'Load posts error:',
      error
    );


    articlesEl.innerHTML = `

      <div class="empty">

        Could not load articles.

        <br>

        <small>
          ${escapeHtml(error.message)}
        </small>

      </div>

    `;

  }

}


/* ============================================================
   RENDER POSTS
   ============================================================ */


function renderPosts() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    posts.filter(
      post => {

        const searchable = [

          post.title,

          post.slug,

          post.category,

          post.excerpt,

          ...(Array.isArray(post.tags)
            ? post.tags
            : [])

        ]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();


        return searchable.includes(
          query
        );

      }
    );


  if (!filtered.length) {

    articlesEl.innerHTML = `

      <div class="empty">

        No articles found.

      </div>

    `;

    return;

  }


  articlesEl.innerHTML =
    filtered
      .map(renderPost)
      .join('');

}


/* ============================================================
   RENDER SINGLE POST
   ============================================================ */


function renderPost(post) {

  const articleUrl =
    './' +
    encodeURIComponent(
      post.slug
    ) +
    '/';


  const tags =
    Array.isArray(post.tags)
      ? post.tags.join(', ')
      : '';


  return `

    <article class="article">

      <div class="article-main">


        <div class="article-content">


          <h2 class="article-title">

            ${escapeHtml(
              post.title
            )}

          </h2>


          <div class="article-meta">

            <span>

              ${escapeHtml(
                formatDate(
                  post.date
                )
              )}

            </span>


            <span>
              •
            </span>


            <span class="badge">

              ${escapeHtml(
                post.category
              )}

            </span>


            <span>
              •
            </span>


            <span>

              ${escapeHtml(
                post.readTime || ''
              )}

            </span>

          </div>


          <div class="article-slug">

            ${escapeHtml(
              post.slug
            )}

          </div>


          ${
            post.excerpt
              ? `

                <div class="article-excerpt">

                  ${escapeHtml(
                    post.excerpt
                  )}

                </div>

              `
              : ''
          }


          ${
            tags
              ? `

                <div
                  style="
                    margin-top:8px;
                    color:#777791;
                    font-size:11px;
                  "
                >

                  ${escapeHtml(
                    tags
                  )}

                </div>

              `
              : ''
          }


        </div>


        <div class="article-actions">


          <button
            class="action-button"
            type="button"
            onclick="viewPost(${JSON.stringify(
              post.slug
            )})"
          >

            View

          </button>


          <button
            class="action-button delete-button"
            type="button"
            onclick="deletePost(${JSON.stringify(
              post.slug
            )})"
          >

            Delete

          </button>


        </div>


      </div>

    </article>

  `;

}


/* ============================================================
   SEARCH
   ============================================================ */


searchInput.addEventListener(
  'input',
  renderPosts
);


/* ============================================================
   VIEW ARTICLE
   ============================================================ */


function viewPost(slug) {

  window.open(

    './' +
    encodeURIComponent(
      slug
    ) +
    '/',

    '_blank'

  );

}


/* ============================================================
   DELETE
   ============================================================ */


/*
  DELETE IS NOT ENABLED YET.

  We are intentionally not sending
  a delete request until the n8n
  delete workflow is built and tested.

  This prevents accidentally deleting
  GitHub files.
*/


async function deletePost(slug) {

  alert(

    'Delete is not enabled yet. ' +
    'We will connect this after the ' +
    'GitHub deletion workflow is tested.'

  );

}


/* ============================================================
   REFRESH
   ============================================================ */


refreshButton.addEventListener(
  'click',
  loadPosts
);


/* ============================================================
   BLOG BUTTON
   ============================================================ */


blogButton.addEventListener(
  'click',
  () => {

    window.location.href =
      './';

  }
);


/* ============================================================
   LOGOUT
   ============================================================ */


logoutButton.addEventListener(
  'click',
  () => {


    /*
      Clear credentials from memory.
    */

    adminUsername = '';

    adminPassword = '';

    posts = [];


    /*
      Hide admin page.
    */

    adminPage.style.display =
      'none';


    /*
      Show login page.
    */

    loginPage.style.display =
      'flex';


    /*
      Clear login fields.
    */

    usernameInput.value =
      '';

    passwordInput.value =
      '';


    /*
      Clear articles.
    */

    articlesEl.innerHTML =
      '';


    /*
      Clear status.
    */

    clearStatus();

  }
);


/* ============================================================
   INITIALIZE APPLICATION
   ============================================================ */


/*
  Load config.json as soon as the
  application starts.

  The login button remains disabled
  until this succeeds.
*/

loadConfig()
  .catch(
    error => {

      console.error(
        'Failed to initialize application:',
        error
      );

    }
  );


</script>

</body>

</html>
