<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="author" content="MarketPulse">
<title>Festive Stock Picks: Diwali, New Year &amp; Holi Picks — MarketPulse</title>
<meta name="description" content="MarketPulse festive picks: 5 large-cap, 5 mid-cap and 5 small-cap stocks for the next 12 months, picked for quality, growth and value, with targets, reasons, risks and a live track record.">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--surface:#0f1629;--surface2:#0c1324;--hover:#151e37;--border:#1f2a46;--text:#e7ecf6;--muted:#a3aec6;--dim:#6e7b98;--accent:#4f46e5;--accent2:#818cf8;--green:#2fd27f;--red:#ff5d6c;--amber:#f3c969;--radius:14px;
 --t1:#7a1d0c;--t2:#c2410c;--t3:#f59e0b;--tglow:#fde68a;--tink:#fff7e6}
[data-theme=light]{--bg:#f3f4f8;--surface:#fff;--surface2:#f7f8fb;--hover:#eef0f6;--border:#e2e4ee;--text:#0f0f1a;--muted:#5a5d6b;--dim:#8b8fa3;--accent2:#4f46e5;--green:#0f8a3e;--red:#c72b2b;--amber:#a16207}
.t-newyear{--t1:#0b1640;--t2:#1e3a8a;--t3:#d4af37;--tglow:#fde68a;--tink:#f8f3e0}
.t-holi{--t1:#6d28d9;--t2:#db2777;--t3:#f59e0b;--tglow:#fef08a;--tink:#fff}
.t-akshaya{--t1:#713f12;--t2:#b45309;--t3:#eab308;--tglow:#fef9c3;--tink:#fffbeb}
.t-independence{--t1:#c2410c;--t2:#1e3a8a;--t3:#15803d;--tglow:#fff;--tink:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
button{font:inherit;color:inherit}
.page{max-width:1320px;margin:0 auto;padding:18px clamp(12px,2.4vw,28px) 40px}
.up{color:var(--green)}.down{color:var(--red)}.muted{color:var(--dim)}

.occ{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.occ::-webkit-scrollbar{display:none}
.occ button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:7px 12px;cursor:pointer;text-align:left;line-height:1.25}
.occ button b{display:block;font-size:13px}
.occ button small{font-size:11px;color:var(--dim);font-weight:600}
.occ button.on{border-color:var(--t3);background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff}
.occ button.on small{color:rgba(255,255,255,.8)}
.occ button .em{margin-right:5px}

.hero{position:relative;overflow:visible;border-radius:18px;padding:30px clamp(16px,4vw,44px) 26px;color:var(--tink);
 background:radial-gradient(120% 140% at 50% 0%,var(--t3) 0%,var(--t2) 38%,var(--t1) 100%);box-shadow:0 10px 40px -18px var(--t2);margin-bottom:14px}
.t-holi .hero{background:radial-gradient(circle at 15% 25%,#facc15 0 12%,transparent 30%),radial-gradient(circle at 85% 20%,#22d3ee 0 10%,transparent 28%),radial-gradient(circle at 70% 85%,#4ade80 0 10%,transparent 30%),linear-gradient(120deg,#6d28d9,#db2777 55%,#f97316)}
.t-independence .hero{background:linear-gradient(180deg,#f97316 0 33%,#fff7ed 33% 66%,#16a34a 66%);color:#0b1640}
.t-independence .hero .eyebrow,.t-independence .hero .meta{color:#1e3a8a}
.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.25),transparent 55%);pointer-events:none}
.hero .deco{position:absolute;bottom:0;overflow:hidden;border-radius:0 0 18px 18px;left:0;right:0;display:flex;justify-content:space-around;font-size:28px;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 10px var(--tglow))}
.hero .eyebrow{position:relative;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.hero h1{position:relative;margin:4px 0 2px;font:800 clamp(30px,5.4vw,56px)/1.05 "Playfair Display",Georgia,serif;letter-spacing:-.5px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.t-independence .hero h1{text-shadow:none}
.hero .sub{position:relative;font-size:clamp(14px,1.8vw,18px);font-weight:600;opacity:.95}
.dl{position:absolute;top:16px;right:16px;z-index:3}
.dlbtn{border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.28);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:8px 15px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.dlbtn:hover{background:rgba(0,0,0,.42)}
.t-independence .dlbtn{background:#0b1640;border-color:#0b1640}
.dlmenu{position:absolute;right:0;top:calc(100% + 8px);width:290px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.45);color:var(--text)}
.dlmenu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 11px;cursor:pointer;line-height:1.3}
.dlmenu button:hover,.dlmenu button:focus-visible{background:var(--hover);outline:none}
.dlmenu b{display:block;font-size:13.5px}
.dlmenu small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111827;color:#fff;border:1px solid #374151;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1000;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.hero .eyebrow{padding-right:118px}.dl{top:12px;right:12px}.dlbtn{padding:7px 12px;font-size:12px}.dlmenu{width:min(290px,calc(100vw - 48px))}}
.hero .meta{position:relative;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;opacity:.92;padding-bottom:26px}

.score{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.score .s{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.score .s span{display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.score .s b{font-size:22px;letter-spacing:-.4px}
.score .s small{display:block;font-size:12px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px;letter-spacing:-.2px}
.letter p{margin:0 0 8px;color:var(--muted);font-size:14px}
.letter p:first-child{color:var(--text);font-weight:700}

.bucket{display:grid;grid-template-columns:34px 1fr;gap:10px;margin-bottom:12px}
.blabel{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff;border-radius:10px;background:linear-gradient(180deg,var(--t2),var(--t1));display:flex;align-items:center;justify-content:center}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--t3)}
.card .top{display:flex;gap:10px;align-items:center;min-width:0}
.mono{flex:0 0 40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;letter-spacing:-.3px}
.card .nm{min-width:0}
.card .nm a{display:block;font-weight:800;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm a:hover{color:var(--accent2)}
.card .nm small{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trio{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end;background:var(--surface2);border-radius:10px;padding:7px 8px}
.trio span{display:block;font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase}
.trio b{font-size:13.5px}
.upb{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border-radius:8px;padding:3px 7px;font-size:12px;font-weight:800;text-align:center;line-height:1.2}
.upb span{color:rgba(255,255,255,.85)!important;font-size:9px!important}
.now{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.now b{font-weight:800}
.hit{position:absolute;top:-8px;right:10px;background:var(--amber);color:#1a1300;font-size:10px;font-weight:800;border-radius:999px;padding:1px 8px}

.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface2);text-align:right;color:var(--dim);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
tr.cap td{background:var(--hover);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:left}
td a{color:var(--text);text-decoration:none;font-weight:700}
td a:hover{color:var(--accent2)}

.detail{scroll-margin-top:84px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden}
.detail>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.detail>summary::-webkit-details-marker{display:none}
.detail>summary .mono{flex-basis:36px;height:36px;font-size:13px}
.detail>summary .t{flex:1;min-width:0}
.detail>summary .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail>summary .t small{color:var(--dim);font-size:12px}
.detail>summary .px{text-align:right;font-size:12.5px;color:var(--muted)}
.detail>summary .px b{color:var(--text);font-size:14px}
.detail>summary:after{content:"▾";color:var(--dim);transition:transform .15s}
.detail[open]>summary:after{transform:rotate(180deg)}
.detail[open]>summary{border-bottom:1px solid var(--border);background:linear-gradient(90deg,color-mix(in srgb,var(--t2) 18%,transparent),transparent)}
.dbody{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;padding:14px}
.dbody h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.dbody ul{margin:0 0 12px;padding-left:18px}
.dbody li{margin-bottom:5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin-bottom:12px}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.math{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px}
.math b{color:var(--text)}
.risk li::marker{color:var(--red)}
.why li::marker{color:var(--green)}
.dlink{font-size:13px;font-weight:700}

.calc{border-color:color-mix(in srgb,var(--t3) 55%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--t2) 10%,var(--surface)),var(--surface) 160px)}
.cform{display:grid;grid-template-columns:minmax(200px,1.1fr) 1.6fr 1fr 1.2fr;gap:12px 16px;align-items:end}
.cfld{display:flex;flex-direction:column;gap:5px;min-width:0}
.cfld>span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.camt{display:flex;align-items:center;gap:6px;border:2px solid var(--t3);border-radius:12px;background:var(--surface2);padding:4px 12px}
.camt b{font-size:22px;color:var(--t3)}
.camt input{border:0;background:none;color:var(--text);font:800 24px/1.2 Inter,system-ui,sans-serif;width:100%;min-width:0;padding:4px 0;outline:none}
.cfld select{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:600 13.5px Inter,system-ui,sans-serif}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
.cchip:hover{border-color:var(--t3)}
.ccheck{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.chint{font-size:12.5px;color:var(--muted);margin:10px 0 12px;min-height:18px}
.cempty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
.csum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.csum>div{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.csum span{display:block;font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.csum b{font-size:20px;letter-spacing:-.3px}
.csum small{display:block;font-size:11.5px;color:var(--muted)}
.cbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.cbar i{display:block;height:100%}
.clegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:6px 0 12px}
.clegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.ctable td small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.ctable tr.skip td{opacity:.55}
.ctable td.qty b{font-size:15px}
.ctable tfoot td{font-weight:800;border-top:2px solid var(--border);background:var(--surface2);text-align:right}
.ctable tfoot td:first-child{text-align:left}
.ccards{display:none}
.cnotes{margin:12px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.cnotes li{margin-bottom:4px}
.cact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn2{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.btn2:hover{border-color:var(--t3)}
@media (max-width:1100px){.cform{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
 .cform{grid-template-columns:1fr}
 .csum{grid-template-columns:1fr 1fr}
 .calc .tablewrap{display:none}
 .ccards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
 .ccard{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
 .ccard>div{min-width:0}
 .ccard>div:first-child{flex:1}
 .ccard b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .ccard small{display:block;font-size:11.5px;color:var(--dim)}
 .ccard .cr{text-align:right;flex:0 0 auto}
 .ccard .cr small b.amt{display:inline;font-size:12px;color:var(--text)}
 .ccard .cr span{font-weight:800;font-size:15px}
 .ccard.tot{border-color:var(--t3)}
}
.method ol{margin:0;padding-left:20px;color:var(--muted)}
.method li{margin-bottom:6px}
.method b{color:var(--text)}
.disc{font-size:12px;color:var(--dim);margin-top:10px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.soon{text-align:center;padding:26px 12px}
.soon .big{font-size:40px;font-weight:800;letter-spacing:-1px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
 .score{grid-template-columns:1fr 1fr}
 .bucket{grid-template-columns:1fr}
 .blabel{writing-mode:horizontal-tb;transform:none;padding:5px 10px;justify-content:flex-start;border-radius:8px}
 .cards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
 .cards::-webkit-scrollbar{display:none}
 .card{scroll-snap-align:start}
 .dbody{grid-template-columns:1fr}
 .detail>summary .px small{display:none}
 .hero .deco{font-size:22px}
}
</style>
<link rel="stylesheet" href="/site-header.css">
<script src="/site-header.js"></script>
<script src="/picks.js?v=4" defer></script>
</head>
<body>
<div id="mpHeader"></div>
<main class="page" id="root">
 <div class="occ" id="occ" role="tablist" aria-label="Occasions"></div>
 <div id="view"><div class="loading">Loading picks…</div></div>
</main>
</body>
</html>
