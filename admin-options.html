<!DOCTYPE html>
<html lang="en">
<head>
<script src="/site-config.js?v=2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0f1e">
<title>Options Paper Desk · MarketPulse Admin</title>
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="stylesheet" href="/site-header.css">
<script src="/site-header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0f1e;--surface:#0f1629;--surface2:#0c1324;--border:#1f2a46;--text:#e7ecf6;--muted:#a3aec6;--accent:#4f46e5;--green:#2fd27f;--red:#ff5d6c}
[data-theme="light"]{--bg:#f5f7fb;--surface:#fff;--surface2:#f0f3f9;--border:#dde3ee;--text:#111827;--muted:#4b5563;--accent:#4338ca;--green:#0f8a3e;--red:#c72b2b}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:24px;margin:4px 0 2px}
.lead{color:var(--muted);margin:0 0 14px;max-width:900px}
.lead a{color:var(--accent)}
.gate{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:560px}
.gate .msg{color:var(--muted);font-size:13px}
.btn{display:inline-flex;padding:8px 12px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px}
</style>
<link rel="stylesheet" href="/options-desk.css?v=4">
</head>
<body>
<div id="mpHeader"></div>
<main class="wrap">
  <h1>Options Paper Desk</h1>
  <p class="lead">The Stock Signals scanner's BUY / SELL ideas on F&amp;O stocks, turned into <b>defined-risk debit spreads</b> and paper-traded at real NSE option prices. The same desk is the admin-only <a href="/stock-signals.html?tab=options">Options tab on the Signals page</a>.</p>
  <div class="gate" id="gate"><p class="msg">Checking access…</p></div>
  <div id="app" hidden></div>
</main>
<script src="/options-desk.js?v=4"></script>
<script>
(async function gate() {
  const $ = (id) => document.getElementById(id);
  const sb = window.supabase.createClient(MP_CONFIG.supabaseUrl, MP_CONFIG.supabaseKey);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('gate').innerHTML = '<h2>Admins only</h2><p class="msg">Sign in with the MarketPulse admin account.</p><a class="btn" href="/?login=1">Sign in</a>'; return; }
  const { data } = await sb.rpc('mp_is_platform_admin');
  if (data !== true) { $('gate').innerHTML = '<h2>Admins only</h2><p class="msg">The Options Paper Desk is only for the MarketPulse admin.</p>'; return; }
  $('gate').hidden = true; $('app').hidden = false;
  window.mpOptionsDesk.mount($('app'), sb);
})();
</script>
</body>
</html>
