# Publishes the daily MarketPulse blog posts (replaces the n8n blog workflow on Termux).
# Runs on GitHub's servers for free; commits the new posts, and Vercel deploys them.
#
# AI commentary needs the repository secret MOONSHOT_API_KEY (Settings → Secrets and variables → Actions).
# Without it, posts still publish with plain data-driven text instead of AI commentary.
#
# After pushing, the job waits for Vercel to start a deployment of the new commit (Vercel once missed one, so the
# day's posts never went live). If none starts within 4 minutes it calls the optional VERCEL_DEPLOY_HOOK secret
# (Vercel → Project → Settings → Git → Deploy Hooks, branch main), and if there is still no deployment the run
# fails, so GitHub emails the repository owner.
name: Blog autopublish

on:
  schedule:
    # GitHub runs schedules on a best-effort basis and sometimes drops them, so each post type has
    # backup times. Every run skips what is already published, so the extra runs are harmless.
    - cron: "7 10 * * 1-5"   # 3:37 PM IST: daily wrap, sector analysis, stock spotlight
    - cron: "37 11 * * 1-5"  # 5:07 PM IST: backup for the above
    - cron: "47 13 * * 1-5"  # 7:17 PM IST: FII/DII flows
    - cron: "17 15 * * 1-5"  # 8:47 PM IST: FII/DII retry if NSE published late
    - cron: "43 16 * * 1-5"  # 10:13 PM IST: FII/DII backup
  workflow_dispatch:
    inputs:
      posts:
        description: "Post types (comma separated): wrap, sector, spotlight, fiidii"
        default: "wrap,sector,spotlight,fiidii"
      force:
        description: "Publish even if today's data looks stale (testing only)"
        type: boolean
        default: false

permissions:
  contents: write
  statuses: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate posts
        id: gen
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FORCE: ${{ inputs.force }}
          POSTS: ${{ inputs.posts || ((github.event.schedule == '7 10 * * 1-5' || github.event.schedule == '37 11 * * 1-5') && 'wrap,sector,spotlight' || 'fiidii') }}
        run: node scripts/blog/generate.mjs

      - name: Commit and push
        if: steps.gen.outputs.count != '0' && steps.gen.outputs.count != ''
        env:
          TITLES: ${{ steps.gen.outputs.titles }}
        run: |
          git config user.name "MarketPulse Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          git commit -m "Publish ${{ steps.gen.outputs.count }} blog post(s)" -m "$TITLES"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT" && exit 0
            sleep $((i * 5))
          done
          exit 1
        id: push

      - name: Make sure Vercel deploys the posts
        if: steps.push.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          started() { gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses" --jq '[.[] | select(.context | test("vercel"; "i"))] | length' 2>/dev/null || echo 0; }
          wait_for() { for i in $(seq 1 "$1"); do [ "$(started)" != "0" ] && return 0; sleep 20; done; return 1; }
          if wait_for 12; then echo "Vercel is deploying ${SHA}"; exit 0; fi
          if [ -n "$HOOK" ]; then
            echo "::warning::Vercel did not start a deployment of ${SHA}; calling the deploy hook."
            curl -fsS -X POST "$HOOK" > /dev/null && sleep 90 && echo "Deploy hook called." && exit 0
          fi
          echo "::error::Vercel did not deploy ${SHA}, so today's posts are not live. Redeploy in Vercel, or add a VERCEL_DEPLOY_HOOK secret so this step can do it."
          exit 1
